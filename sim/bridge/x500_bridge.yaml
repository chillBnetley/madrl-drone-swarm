# ros_gz_bridge configuration — ROS 2 **Humble**.
#
# In Humble you must give BOTH ros_topic_name and gz_topic_name.
# The short `topic_name:` form is Jazzy only and silently does nothing here.
#
# Usage:
#   ros2 run ros_gz_bridge parameter_bridge --ros-args \
#     -p config_file:=$HOME/x500_ws/src/x500_sim/bridge/x500_bridge.yaml

- ros_topic_name: "/x500/imu"
  gz_topic_name: "/world/x500_world/model/x500/link/base_link/sensor/imu/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: "/x500/navsat"
  gz_topic_name: "/world/x500_world/model/x500/link/base_link/sensor/navsat/navsat"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: "/x500/scan"
  gz_topic_name: "/world/x500_world/model/x500/link/lidar_2d_v2_link/sensor/lidar_2d_v2/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: "/x500/air_pressure"
  gz_topic_name: "/world/x500_world/model/x500/link/base_link/sensor/air_pressure/air_pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "gz.msgs.FluidPressure"
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

# Ground-truth pose from the RobotPosePublisher plugin.
- ros_topic_name: "/x500/pose"
  gz_topic_name: "/x500/pose"
  ros_type_name: "geometry_msgs/msg/PoseStamped"
  gz_type_name: "gz.msgs.Pose"
  direction: GZ_TO_ROS

# Velocity command sent by ROS 2 to the MulticopterVelocityControl plugin.
- ros_topic_name: "/x500/cmd_vel"
  gz_topic_name: "/x500/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
