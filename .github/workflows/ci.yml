name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  env-contract:
    name: env contract (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only numpy is needed: the environment and its tests have no torch,
      # stable-baselines3, ROS 2 or Gazebo dependency on purpose.
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Environment sanity check
        run: python rl/check_env.py

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Training scripts parse their CLI
        run: |
          python rl/train_ppo.py --help > /dev/null
          python rl/train_sac.py --help > /dev/null
          python rl/train_mappo.py --help > /dev/null
